name: MLflow Project Retraining

on:
  push:
    paths:
      - "MLProject/**"
      - "!MLProject/model_output/**"
      - "!MLProject/training_artifacts/**"
      - "!MLProject/run_id.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 pandas==2.2.3 numpy==2.2.1 scikit-learn==1.6.0 joblib==1.4.2

      - name: Run MLflow Project
        working-directory: MLProject
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: mlflow run . --env-manager=local

      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hotel-booking-training-artifacts
          path: |
            MLProject/model_output
            MLProject/training_artifacts
            MLProject/run_id.txt

      - name: Commit model artifact snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MLProject/model_output MLProject/training_artifacts MLProject/run_id.txt
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Update CI hotel booking artifacts"
            git push
          fi

      - name: Build and push Docker image when secrets are configured
        working-directory: MLProject
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MLFLOW_TRACKING_URI: file:./mlruns
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Docker Hub secrets are not configured. Skipping Docker build/push."
            exit 0
          fi
          IMAGE_NAME="$DOCKERHUB_USERNAME/hotel-booking-cancellation:latest"
          RUN_ID="$(cat run_id.txt)"
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "$IMAGE_NAME" \
            --env-manager=local \
            --enable-mlserver
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          docker push "$IMAGE_NAME"

